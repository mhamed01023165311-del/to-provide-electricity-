<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltSync - منظومة إدارة الطاقة الذكية</title>
    <!-- مكتبات التشغيل الفوري المستقرة -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- أيقونات Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div id="root"></div>

    <script type="text/babel">
        // 1️⃣ محرك حساب الشرائح والمياه المصرية
        function calculateElectricityTariff(kwh) {
            let cost = 0;
            let tierName = "الشريحة الأولى";
            if (kwh <= 50) {
                cost = kwh * 0.68;
                tierName = "الشريحة الأولى (٠-٥٠ ك.و.س)";
            } else if (kwh <= 100) {
                cost = 50 * 0.68 + (kwh - 50) * 0.78;
                tierName = "الشريحة الثانية (٥١-١٠٠ ك.و.س)";
            } else {
                cost = kwh * 1.25;
                tierName = "الشريحة الثالثة (المستهلك العادي)";
            }
            return { cost, tierName };
        }

        function calculateWaterTariff(cubicMeters) {
            return { cost: cubicMeters * 1.50, tierName: "الشريحة المنزلية العادية" };
        }

        // 2️⃣ مكون محرك الكاميرات المنفصلة والواجهة
        function DeltaEntryEngine({ activeServiceType, activeAccount, onUpdateBalance, showToast }) {
            const isElectricity = activeServiceType === 'electricity';
            const unitLabel = isElectricity ? 'ك.و.س' : 'م³';

            const [inputValueMeterId, setInputValueMeterId] = React.useState('');
            const [inputValueBalance, setInputValueBalance] = React.useState('');
            const [inputValueDays, setInputValueDays] = React.useState('');
            const [inputValueReading, setInputValueReading] = React.useState('');
            const [isCameraActive, setIsCameraActive] = React.useState(false);
            const [currentActiveScan, setCurrentActiveScan] = React.useState(null);

            const startCamera = (scanType) => {
                setIsCameraActive(true);
                setCurrentActiveScan(scanType);
                
                showToast(`📸 جاري تشغيل عدسة الـ AI لمسح خانة ${scanType === 'kwh' ? 'العداد' : 'الرصيد'}...`);
                
                // محاكاة لقط البيانات الذكي بعد ثانيتين لمنع تعليق المتصفح على الموبايل
                setTimeout(() => {
                    setIsCameraActive(false);
                    setInputValueMeterId(activeAccount.meterId || 'LEG-2026-8801');
                    setInputValueDays('15');

                    if (scanType === 'kwh') {
                        const generatedReading = isElectricity ? '3240.5' : '194.2';
                        setInputValueReading(generatedReading);
                        showToast(`✅ تم لقط قراءة العداد بنجاح: ${generatedReading} ${unitLabel}`);
                    } else {
                        const generatedBalance = isElectricity ? '220.50' : '85.00';
                        setInputValueBalance(generatedBalance);
                        showToast(`✅ تم قشط كارت الرصيد: ${generatedBalance} ج.م`);
                    }
                }, 1800);
            };

            const handleApply = (e) => {
                e.preventDefault();
                const valueReadingNum = parseFloat(inputValueReading);
                const valueBalanceNum = parseFloat(inputValueBalance);

                if (isNaN(valueReadingNum) || isNaN(valueBalanceNum)) {
                    showToast('❌ برجاء مسح البيانات بالكاميرا أولاً');
                    return;
                }

                const tariff = isElectricity ? calculateElectricityTariff(45) : calculateWaterTariff(5);
                const postCostBalance = Math.max(0, valueBalanceNum - tariff.cost);
                
                onUpdateBalance(postCostBalance);
                showToast(`📊 تمت العملية! الرصيد الجديد بعد خصم الشريحة: ${postCostBalance.toFixed(2)} ج.م`);
                
                setInputValueReading('');
                setInputValueBalance('');
            };

            return (
                <div class="space-y-6">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        
                        {/* لوحة معالجة الرؤية الحاسوبية */}
                        <section class="lg:col-span-5 bg-white border border-gray-200 p-6 rounded-2xl space-y-4 shadow-sm">
                            <div class="text-right">
                                <h3 class="text-sm font-black text-slate-800">عدسة الفحص الـ AI وقشط الأرقام</h3>
                                <p class="text-[11px] text-slate-500 font-bold">شاشة معالجة الرؤية الحاسوبية المباشرة</p>
                            </div>

                            <div class="relative aspect-square w-full bg-slate-950 rounded-xl flex flex-col items-center justify-center text-center border border-slate-800 overflow-hidden">
                                {isCameraActive ? (
                                    <div class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center p-4">
                                        <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                                        <p class="text-xs text-emerald-400 font-bold animate-pulse">جاري فحص المسار الرقمي وتحديد الأرقام...</p>
                                    </div>
                                ) : (
                                    <div class="p-4 text-slate-400">
                                        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3">
                                            <i data-lucide="camera" class="w-6 h-6"></i>
                                        </div>
                                        <p class="text-xs font-black text-slate-300">العدسة الذكية مغلقة</p>
                                        <p class="text-[10px] text-slate-500 mt-1">اضغط على أزرار الفتح بالأسفل لتعبئة الخانات تلقائياً</p>
                                    </div>
                                )}
                            </div>
                        </section>

                        {/* لوحة التحكم والمدخلات الرقمية */}
                        <section class="lg:col-span-7 bg-white border border-gray-200 p-6 rounded-2xl space-y-6 shadow-sm">
                            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                <h3 class="text-sm font-black text-slate-800">خانات التحكم والمدخلات الرقمية</h3>
                                <span class="text-[11px] bg-slate-100 p-1 px-2 rounded-lg font-bold text-slate-600">العداد النشط: {activeAccount.meterId}</span>
                            </div>

                            <div class="p-3 bg-emerald-50 border border-emerald-100 rounded-xl space-y-2">
                                <span class="block text-[11px] font-black text-emerald-800">📸 تشغيل الكاميرا المنفصلة لقشط البيانات:</span>
                                <div class="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={() => startCamera('kwh')} class="py-2.5 px-3 bg-blue-600 hover:bg-blue-700 text-white font-black text-xs rounded-lg transition-all border-none cursor-pointer shadow-sm">
                                        مسح شاشة العداد (kW)
                                    </button>
                                    <button type="button" onClick={() => startCamera('cash')} class="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs rounded-lg transition-all border-none cursor-pointer shadow-sm">
                                        مسح كارت الرصيد (EGP)
                                    </button>
                                </div>
                            </div>

                            <form onSubmit={handleApply} class="space-y-4">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-500 mb-1">رقم العداد المكتشف:</label>
                                        <input type="text" value={inputValueMeterId} onChange={(e) => setInputValueMeterId(e.target.value)} class="w-full text-xs font-mono font-bold p-3 bg-slate-50 border border-gray-200 rounded-xl text-left focus:outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-500 mb-1">الرصيد المقشوط بالكارت (ج.م):</label>
                                        <input type="text" readOnly placeholder="في انتظار الكاميرا..." value={inputValueBalance} class="w-full text-sm font-mono font-black p-3 bg-slate-100 border border-gray-200 rounded-xl text-left text-blue-600" />
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-500 mb-1">المدة المتوقعة باليوم:</label>
                                        <input type="number" value={inputValueDays} onChange={(e) => setInputValueDays(e.target.value)} class="w-full text-xs font-mono font-bold p-3 bg-slate-50 border border-gray-200 rounded-xl text-left focus:outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-500 mb-1">القراءة الجديدة ({unitLabel}):</label>
                                        <input type="text" readOnly placeholder="في انتظار الكاميرا..." value={inputValueReading} class="w-full text-sm font-mono font-black p-3 bg-slate-100 border border-gray-200 rounded-xl text-left text-emerald-600" />
                                    </div>
                                </div>

                                {inputValueReading && inputValueBalance && (
                                    <button type="submit" class="w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-black text-xs rounded-xl shadow-md transition-all cursor-pointer border-none">
                                        تطبيق التفاضل الفوري واعتماد الرصيد الجديد رسمياً
                                    </button>
                                )}
                            </form>
                        </section>
                    </div>
                </div>
            );
        }

        // 3️⃣ المكون الرئيسي للأبليكيشن (App)
        function App() {
            const [serviceType, setServiceType] = React.useState('electricity');
            const [balance, setBalance] = React.useState(150.75);
            const [toastMessage, setToastMessage] = React.useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 4000);
            };

            React.useEffect(() => {
                // تفعيل أيقونات لوسيد بعد رندرة الصفحة
                if (window.lucide) window.lucide.createIcons();
            }, [serviceType, toastMessage]);

            const mockAccount = { meterId: 'MTR-2026-9942', owner: 'محمد فرغلي' };

            return (
                <div class="max-w-5xl mx-auto px-4 py-8">
                    {/* التنبيهات الإشعارية الصاعدة */}
                    {toastMessage && (
                        <div class="fixed top-4 left-4 right-4 sm:left-auto sm:w-96 bg-slate-900 text-white text-xs p-4 rounded-xl shadow-2xl border border-slate-800 z-50 flex items-center gap-2 animate-bounce">
                            <span class="font-bold">{toastMessage}</span>
                        </div>
                    )}

                    {/* الهيدر والعنوان الرئيسي */}
                    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-200 pb-6 mb-6">
                        <div class="text-right">
                            <h1 class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                                <span class="bg-amber-500 text-white p-1.5 rounded-lg text-sm">⚡</span>
                                VoltSync Smart System
                            </h1>
                            <p class="text-xs text-slate-500 font-bold mt-1">منظومة قشط قراءات العدادات الذكية ومعالجة الفواتير الفورية</p>
                        </div>

                        {/* تحويل نوع المرفق كهرباء / مياه */}
                        <div class="bg-white border border-gray-200 p-1.5 rounded-xl flex items-center gap-1 shadow-sm">
                            <button onClick={() => setServiceType('electricity')} class={`px-4 py-2 rounded-lg font-black text-xs transition-all border-none cursor-pointer ${serviceType === 'electricity' ? 'bg-amber-500 text-white shadow-sm' : 'bg-transparent text-slate-600 hover:bg-slate-50'}`}>
                                عداد الكهرباء
                            </button>
                            <button onClick={() => setServiceType('water')} class={`px-4 py-2 rounded-lg font-black text-xs transition-all border-none cursor-pointer ${serviceType === 'water' ? 'bg-blue-600 text-white shadow-sm' : 'bg-transparent text-slate-600 hover:bg-slate-50'}`}>
                                عداد المياه
                            </button>
                        </div>
                    </header>

                    {/* لوحة عرض الرصيد الإجمالي السريع */}
                    <section class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-6 rounded-2xl mb-6 shadow-md flex items-center justify-between">
                        <div>
                            <span class="text-[10px] uppercase tracking-wider font-black opacity-60 block mb-1">إجمالي الرصيد الفعلي الحالي</span>
                            <span class="text-3xl font-mono font-black">{balance.toFixed(2)} <span class="text-sm font-sans">ج.م</span></span>
                        </div>
                        <div class="text-left">
                            <span class="text-[11px] font-bold bg-white/10 px-3 py-1 rounded-full text-emerald-400">● متصل بالشبكة الموحدة</span>
                        </div>
                    </section>

                    {/* استدعاء محرك الكاميرات والتحكم */}
                    <DeltaEntryEngine 
                        activeServiceType={serviceType} 
                        activeAccount={mockAccount} 
                        onUpdateBalance={setBalance} 
                        showToast={showToast} 
                    />
                </div>
            );
        }

        // رندرة التطبيق بالكامل داخل الـ Root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
