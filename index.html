<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>VoltSync - المترجم المباشر</title>
    <!-- 1. استدعاء المترجم (Babel) عشان يترجم لغة الـ React اللي مش فاهمها المتصفح -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 2. استدعاء المكونات الأساسية للـ React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <!-- 3. هنا بقى "لغة المترجم": أي كود هتكتبه جوه الـ type="text/babel" هيتحول للغة المتصفح -->
    <script type="text/babel">
        // هنا هتحط كود الـ App.tsx بتاعك بالكامل
        function App() {
            return (
                <div className="p-8 text-center text-xl font-bold bg-white shadow-lg rounded-2xl">
                    تم الترجمة بنجاح! الموقع دلوقتي بيفهم لغتك.
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
